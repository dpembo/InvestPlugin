name: InvestPlugin
version: '${project.version}'
main: com.investplugin.InvestPlugin
api-version: '1.21'
description: Capital and investment-pot investing with a daily market move, GUI and SQL storage
authors: [InvestPlugin]
depend: [Vault]

# Downloaded by the server on first start (needs access to Maven Central once)
libraries:
  - org.mariadb.jdbc:mariadb-java-client:3.5.1
  - org.xerial:sqlite-jdbc:3.46.1.3

commands:
  invest:
    description: Open the investment menu
    usage: /invest [deposit|withdraw|auto|status]
    permission: investplugin.invest

permissions:
  investplugin.invest:
    description: Allows a player to use /invest
    default: true
  investplugin.admin:
    description: Allows /invest reload and /invest runcycle
    default: op
